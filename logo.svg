<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#9c7a1a"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="112" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

  <!-- wings -->
  <path d="M55 78 C40 70, 30 55, 28 40 C45 45, 58 55, 66 70 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M185 78 C200 70, 210 55, 212 40 C195 45, 182 55, 174 70 Z" fill="#ffffff" opacity="0.9"/>

  <!-- basketball -->
  <circle cx="120" cy="66" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M120 40 Q108 66 120 92" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M120 40 Q132 66 120 92" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M95 55 Q120 66 145 55" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M95 77 Q120 66 145 77" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- SC5 -->
  <text x="120" y="140" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="42" text-anchor="middle" fill="#ffffff" letter-spacing="1">SC<tspan fill="url(#goldGrad)">5</tspan></text>

  <!-- DYNAMICS -->
  <text x="120" y="160" font-family="Arial, sans-serif" font-weight="700" font-size="14" text-anchor="middle" fill="#ffffff" letter-spacing="3">DYNAMICS</text>

  <!-- divider -->
  <line x1="70" y1="172" x2="170" y2="172" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- DUBAI -->
  <text x="120" y="188" font-family="Arial, sans-serif" font-weight="700" font-size="12" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="4">DUBAI</text>

  <!-- star -->
  <path d="M120 198 l3.5 7.2 8 1.2 -5.8 5.6 1.4 8 -7.1 -3.8 -7.1 3.8 1.4 -8 -5.8 -5.6 8 -1.2 z" fill="url(#goldGrad)"/>
</svg>
